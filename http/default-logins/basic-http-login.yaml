id: generic-http-login

info:
  name: Generic HTTP - Default Login
  author: matejsmycka
  description: |
    Generic HTTP service with default credentials.
  severity: high
  tags: http,default-login

flow: http(1) && http(2)

requests:
  - raw:
      - |
        GET {{login_path}} HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic RandomStringThatDoesNotExist==

      - |
        GET {{login_path}} HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ":" + password)}}

    attack: clusterbomb
    payloads:
      username:
        - admin
        - test
      password:
        - admin
        - test
        - password
      login_path:
        - /login
        - /admin
        - /logs
        - /

    stop-at-first-match: true
    matchers:
      - type: dsl
        condition: and
        dsl:
          - 'status_code_1 == 401 || status_code_1 == 403 || status_code_1 == 301'
          - 'status_code_2 == 200'