id: konica-minolta-default-login

info:
  name: Konica - Default Login
  author: matejsmycka
  severity: high
  description: |
    Konica Minolta printers with default credentials can be accessed using the default username and password.
  reference:
    - https://manuals.konicaminolta.eu/ineo-654e-754e/EN/contents/id08-_101032677.html
  tags: konica,default-login

http:
  - method: GET
    path:
      - "{{BaseURL}}/

    extractors:
      - type: regex
        part: body
        name: osd
        group: 1
        internal: true
        regex:
          - "&quot;version&quot;:&quot;([0-9.]+)&quot;"

  - raw:
      - |
        POST /auth/login HTTP/1.1
        Host: {{Hostname}}
        Osd-Version: {{osd}}
        osd-xsrf: osd-fetch
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}"}

    attack: clusterbomb
    payloads:
      username:
        - "admin"
        - "wazuh"
      password:
        - "admin"
        - "wazuh"
        - "SecretPassword"
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"username":'
          - '"roles":'
        condition: and

      - type: word
        part: header
        words:
          - "application/json"
        condition: and

      - type: status
        status:
          - 200
